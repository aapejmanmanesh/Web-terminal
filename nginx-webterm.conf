# WebTerm behind nginx — https://__DOMAIN__
#
# WebTerm itself listens on 127.0.0.1:__PORT__ (plain HTTP, local only) with
# "trustProxy": true in /etc/webterm/config.json. nginx terminates TLS and
# passes WebSockets (terminals, IDE) and streamed uploads/downloads through.

upstream webterm_backend {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

# WebSocket upgrade for terminal and IDE connections; keep-alive otherwise.
map $http_upgrade $webterm_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/webterm-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl __HTTP2__;
    listen [::]:443 ssl __HTTP2__;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:webterm_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads of any size are streamed straight through (no temp files).
    client_max_body_size 0;
    proxy_request_buffering off;
    # Terminal output, downloads and archives are streamed too.
    proxy_buffering off;
    # Long-lived terminal/IDE WebSockets and long transfers.
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    # Downloads of many selected files use long query strings.
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass http://webterm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (never append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $webterm_connection;
    }
}
